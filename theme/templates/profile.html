{% extends "page.html" %}

{% from 'bibliography.j2' import bibliography %}

{% block content %}
    <article class="profile-layout">
        <div class="profile-intro">
            <header class="page-header">
                <h1>{{ page.title }}</h1>
            </header>
            <section class="bio entry-content" id="bio">
                <img class="bio-photo" src="{{ page.profilepicture }}" alt="Photo of Michael Goerz" width="148" height="200">
                <div class="bio-text">
                    {{ page.content }}
                </div>
            </section>
        </div>
        {% include 'includes/sidebar.html' %}
        <div class="profile-bibliography entry-content">
            {% for bibtitle, bibfile in page.bibliography %}
            {{ bibliography(bibtitle, read_bibtex(bibfile)) }}
            {% endfor %}
        </div>
    </article>
{% endblock %}
