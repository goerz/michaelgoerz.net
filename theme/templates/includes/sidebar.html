<aside class="profile-sidebar" aria-label="Contact">
    {% if CONTACT %}
    <section>
        <h2 class="sidebar-heading"><i class="fa-solid fa-user"></i> Contact</h2>
        <ul class="sidebar-links contact-links">
            {% for symbol, text, link in CONTACT %}
            <li><a href="{{ link }}"><i class="{{ symbol }}"></i> {{ text }}</a></li>
            {% endfor %}
        </ul>
    </section>
    {% endif %}
    {% if SOCIAL %}
    <section>
        <h2 class="sidebar-heading"><i class="fa-solid fa-users"></i> Social</h2>
        <ul class="sidebar-links contact-links">
            {% for symbol, text, link in SOCIAL %}
            <li><a rel="me" href="{{ link }}"><i class="{{ symbol }}"></i> {{ text }}</a></li>
            {% endfor %}
        </ul>
    </section>
    {% endif %}
</aside>
