# Projects shown on the Programming page (rendered by
# theme/templates/projects.html).
#
# Each section has a `title`, an `id` (anchor), an optional `intro`, an optional
# number of grid `columns` (2 or 3, default 3), and a list of `projects`. Each
# project has:
#
#   name         Display name (required)
#   url          Main link, usually the GitHub repository (required)
#   description  One or two sentences; may contain inline HTML (required)
#   org          GitHub organization/user, shown in front of the name
#   docs         Link to the documentation or homepage
#   language     Primary language
#   role         My role in the project
#   logo         Image file next to the projects.yml file
#   packages     List of related packages, each with `name`, `url`, and
#                `description`. A project with packages spans a full row.
#   links        List of additional links, each with `title` and `url`
#
# The `more` list at the end is a plain list of smaller items.

sections:

  - title: Quantum Dynamics and Optimal Control
    id: quantum-control
    columns: 2
    projects:

      - name: QuantumControl.jl
        org: JuliaQuantumControl
        url: https://github.com/JuliaQuantumControl/QuantumControl.jl
        docs: https://juliaquantumcontrol.github.io/QuantumControl.jl/
        language: Julia
        role: Lead developer
        logo: juliaquantumcontrol.svg
        description: >-
          Julia framework for quantum dynamics and open-loop quantum optimal
          control, combining efficiency and flexibility with modern methods of
          automatic differentiation. It exposes a single API for the packages
          in the JuliaQuantumControl organization.
        packages:
          - name: QuantumPropagators.jl
            url: https://github.com/JuliaQuantumControl/QuantumPropagators.jl
            description: Simulating quantum dynamics; the numerical backend for all control methods
          - name: GRAPE.jl
            url: https://github.com/JuliaQuantumControl/GRAPE.jl
            description: Gradient ascent pulse engineering with <a href="https://arxiv.org/abs/2205.15044">semi-automatic differentiation</a>
          - name: Krotov.jl
            url: https://github.com/JuliaQuantumControl/Krotov.jl
            description: Krotov's method, a port of the <code>krotov</code> Python package
          - name: QuantumGradientGenerators.jl
            url: https://github.com/JuliaQuantumControl/QuantumGradientGenerators.jl
            description: Dynamic gradients for quantum control
          - name: TwoQubitWeylChamber.jl
            url: https://github.com/JuliaQuantumControl/TwoQubitWeylChamber.jl
            description: Analyzing two-qubit gates in the Weyl chamber

      - name: krotov
        org: qucontrol
        url: https://github.com/qucontrol/krotov
        docs: https://qucontrol.github.io/krotov
        language: Python
        role: Lead developer
        description: >-
          Python implementation of Krotov's method for quantum optimal control,
          built on top of <a href="https://qutip.org">QuTiP</a>. Described in
          <a href="https://doi.org/10.21468/SciPostPhys.7.6.080">SciPost Phys. 7, 80 (2019)</a>.

      - name: QDYN
        url: https://www.qdyn-library.net
        docs: https://www.qdyn-library.net
        language: Fortran
        role: Lead developer 2008–2015, contributor since
        logo: qdyn.svg
        description: >-
          Fortran 95 library and collection of utilities for the simulation of
          quantum dynamics and optimal control, with a focus on both efficiency
          and precision. Developed in the group of Christiane Koch.

      - name: QNET
        org: mabuchilab
        url: https://github.com/mabuchilab/QNET
        docs: https://qnet.readthedocs.io/
        language: Python
        role: Lead developer 2016–2018
        logo: qnet_logo_medium.png
        description: >-
          Computer algebra package for quantum mechanics and photonic quantum
          networks. Originally developed by Nikolas Tezak in the Mabuchi Lab at
          Stanford.

      - name: weylchamber
        org: qucontrol
        url: https://github.com/qucontrol/weylchamber
        docs: https://qucontrol.github.io/weylchamber/
        language: Python
        role: Author
        description: >-
          Python package for analyzing two-qubit gates in the Weyl chamber.

  - title: Documentation Tools
    id: documentation
    projects:

      - name: DocumenterCitations.jl
        org: JuliaDocs
        url: https://github.com/JuliaDocs/DocumenterCitations.jl
        docs: https://juliadocs.github.io/DocumenterCitations.jl/
        language: Julia
        role: Maintainer
        description: >-
          BibTeX citations and bibliographies in documentation generated by
          <a href="https://documenter.juliadocs.org">Documenter.jl</a>.

      - name: DocumenterInterLinks.jl
        org: JuliaDocs
        url: https://github.com/JuliaDocs/DocumenterInterLinks.jl
        docs: http://juliadocs.org/DocumenterInterLinks.jl/
        language: Julia
        role: Author
        description: >-
          A plugin for Documenter.jl that enables linking between projects via
          inventory files (read and written with
          <a href="https://github.com/JuliaDocs/DocInventories.jl">DocInventories.jl</a>).

      - name: docs_versions_menu
        url: https://github.com/goerz/docs_versions_menu
        docs: https://goerz.github.io/docs_versions_menu
        language: Python
        role: Author
        description: >-
          A versions menu for Sphinx-based documentation.

  - title: Editor and Terminal Tools
    id: tools
    projects:

      - name: jupytext.nvim
        url: https://github.com/goerz/jupytext.nvim
        language: Lua
        role: Author
        description: >-
          Edit Jupyter notebooks in Neovim as plain text via
          <a href="https://github.com/mwouts/jupytext">jupytext</a>. Successor
          of the Vim plugin <a href="https://github.com/goerz/jupytext.vim">jupytext.vim</a>.

      - name: MuxDisplay.jl
        url: https://github.com/goerz/MuxDisplay.jl
        docs: https://goerz.github.io/MuxDisplay.jl/
        language: Julia
        role: Author
        description: >-
          A Julia display that shows graphics in a dedicated tmux pane, for
          working in the terminal on a remote workstation.

      - name: tmuxpair
        url: https://github.com/goerz/tmuxpair
        language: Python
        role: Author
        description: >-
          Command line script for setting up a temporary tmux session for pair
          programming.

more:
  - name: Refcards
    url: ../refcards/
    description: Reference cards for Python, Fortran, Vim, and more
  - name: cookiecutter-pypackage
    url: https://github.com/goerz/cookiecutter-pypackage
    description: Project template for scientific Python packages
  - name: cookiecutter-juliapackage
    url: https://github.com/goerz/cookiecutter-juliapackage
    description: Project template for Julia packages
  - name: dotfiles
    url: https://github.com/goerz/dotfiles
    description: Dotfiles and management scripts for macOS and Linux
  - name: neovimrc
    url: https://github.com/goerz/neovimrc
    description: Neovim configuration
